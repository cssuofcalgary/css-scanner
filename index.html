<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐼 CSS Fast Door Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    
    /* Top Bar */
    .top-bar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 16px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-recent {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .btn-recent:active {
      transform: scale(0.95);
      background: #334155;
    }
    .stat-badge {
      background: #10b981;
      color: white;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* Scanner Viewport */
    #scanner-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Target Reticle Overlay */
    .reticle-box {
      position: absolute;
      width: 250px;
      height: 250px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }
    .reticle-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #10b981;
      border-style: solid;
    }
    .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 20px; }
    .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 20px; }
    .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 20px; }
    .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 20px; }

    .laser-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, transparent);
      box-shadow: 0 0 8px #10b981;
      top: 0;
      animation: scanAnim 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes scanAnim {
      0% { top: 10%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { top: 90%; opacity: 0; }
    }

    /* Result Banner Card */
    #result-banner {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      border-radius: 20px;
      padding: 18px 20px;
      text-align: center;
      z-index: 30;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    @keyframes popIn {
      from { transform: translateY(30px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    
    .status-checked-in {
      background: rgba(16, 185, 129, 0.95);
      border: 1px solid #34d399;
      color: white;
    }
    .status-already-scanned {
      background: rgba(245, 158, 11, 0.95);
      border: 1px solid #fbbf24;
      color: white;
    }
    .status-unpaid {
      background: rgba(239, 68, 68, 0.95);
      border: 1px solid #f87171;
      color: white;
    }
    .status-invalid {
      background: rgba(100, 116, 139, 0.95);
      border: 1px solid #cbd5e1;
      color: white;
    }

    .banner-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .banner-sub {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }

    /* Slide-Up Drawer for Recent Scans */
    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 40;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.active {
      display: block;
      opacity: 1;
    }

    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 75vh;
      background: #0f172a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
    }
    .drawer.active {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 40px;
      height: 4px;
      background: #475569;
      border-radius: 10px;
      margin: 12px auto 6px;
    }
    .drawer-header {
      padding: 12px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .drawer-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
    }
    .btn-close {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hc-name {
      font-weight: 700;
      font-size: 15px;
      color: white;
    }
    .hc-id {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .hc-badge {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-orange { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .drawer-footer {
      padding: 14px 20px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
    }
    .btn-reset-roster {
      flex: 1;
      background: #dc2626;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Sound prompt banner */
    #sound-prompt {
      position: absolute;
      top: 60px;
      left: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 25;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <span>🐼</span> CSS Scanner
    </div>
    <div class="top-actions">
      <button class="btn-recent" onclick="openDrawer()">
        <span>📋</span> Recent (<span id="recent-count">0</span>)
      </button>
      <div class="stat-badge" onclick="confirmResetRoster()">
        <span>👥</span> <span id="count-display">0</span>
      </div>
    </div>
  </div>

  <!-- Audio Unlock Prompt -->
  <div id="sound-prompt" onclick="enableAudio()">
    <span>🔊</span> Tap for Chimes
  </div>

  <!-- Scanner Container -->
  <div id="scanner-container">
    <div id="reader"></div>

    <div class="reticle-box">
      <div class="reticle-corner tl"></div>
      <div class="reticle-corner tr"></div>
      <div class="reticle-corner bl"></div>
      <div class="reticle-corner br"></div>
      <div class="laser-line"></div>
    </div>

    <!-- Result Pop-up Card -->
    <div id="result-banner">
      <div class="banner-title" id="banner-title">Checked In!</div>
      <div class="banner-sub" id="banner-sub">Alice Wong • RSVP Ticket</div>
    </div>
  </div>

  <!-- Slide-Up Drawer for Recent Scans -->
  <div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-handle" onclick="closeDrawer()"></div>
    <div class="drawer-header">
      <div class="drawer-title">📋 Recent Scans (<span id="drawer-count">0</span>)</div>
      <button class="btn-close" onclick="closeDrawer()">✖</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div style="color:#64748b; text-align:center; padding: 40px 10px; font-size:14px;">
        No scans in this session yet.<br>Point camera at attendee QR codes to check them in.
      </div>
    </div>
    <div class="drawer-footer">
      <button class="btn-reset-roster" onclick="confirmResetRoster()">⚡ Reset Test Attendees Roster</button>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;
    let lastScanTime = 0;
    let lastScannedText = "";
    let audioCtx = null;
    let audioEnabled = false;
    let scanHistory = [];

    // Apps Script Deployment API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzr8duP390SpoC7o0k3fsCDAOc3nkjHoGqPRiewrqHngalE_EcPaEaMv0408BAjnMDM4w/exec";

    // Auto-unlock audio on any user tap
    document.addEventListener("click", () => {
      if (!audioEnabled) enableAudio();
    }, { once: true });

    function enableAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioEnabled = true;
      const prompt = document.getElementById('sound-prompt');
      if (prompt) prompt.style.display = 'none';
      playSuccessSound();
    }

    function playSuccessSound() {
      if (!audioEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.setValueAtTime(880, now + 0.1); // A5
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    }

    function playWarningSound() {
      if (!audioEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.setValueAtTime(220, now + 0.12);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    // --- Fetch initial count from Google Sheet on page load ---
    fetch(API_URL + "?action=count")
      .then(res => res.json())
      .then(d => {
        if (d && d.totalCheckedIn !== undefined) {
          updateCount(d.totalCheckedIn);
        }
      })
      .catch(e => console.log("Initial count fetch error:", e));

    function updateCount(num) {
      document.getElementById("count-display").innerText = num;
    }

    // --- QR Scan Handler ---
    function onScanSuccess(decodedText) {
      const now = Date.now();
      // Debounce: ignore same code within 2.5 seconds
      if (decodedText === lastScannedText && (now - lastScanTime < 2500)) {
        return;
      }
      if (isProcessing) return;

      lastScanTime = now;
      lastScannedText = decodedText;
      isProcessing = true;

      // Extract ID from full URL or raw code
      let ticketId = decodedText.trim();
      if (ticketId.includes("ticket=")) {
        ticketId = ticketId.split("ticket=")[1].split("&")[0];
      } else if (ticketId.includes("member=")) {
        ticketId = ticketId.split("member=")[1].split("&")[0];
      } else if (ticketId.includes("id=")) {
        ticketId = ticketId.split("id=")[1].split("&")[0];
      }

      fetch(API_URL + "?ticket=" + encodeURIComponent(ticketId))
        .then(res => res.json())
        .then(data => {
          handleScanResult(data, ticketId);
          setTimeout(() => { isProcessing = false; }, 1000);
        })
        .catch(err => {
          showBanner("status-invalid", "❌ Connection Error", err.message);
          playWarningSound();
          setTimeout(() => { isProcessing = false; }, 1000);
        });
    }

    function handleScanResult(data, ticketId) {
      const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (data.status === "CHECKED_IN") {
        playSuccessSound();
        showBanner("status-checked-in", "✔ Checked In!", (data.name || "Attendee") + " • " + (data.type || "Ticket"));
        if (data.totalCheckedIn !== undefined) {
          updateCount(data.totalCheckedIn);
        }
        addHistoryRecord(data.name, data.id || ticketId, "Checked In", "badge-green", timeStr);

      } else if (data.status === "ALREADY_SCANNED") {
        playWarningSound();
        showBanner("status-already-scanned", "⚠ Already Scanned", (data.name || "Attendee") + " • First checked in: " + (data.time || "earlier"));
        addHistoryRecord(data.name, data.id || ticketId, "Already Scanned", "badge-orange", timeStr);

      } else if (data.status === "UNPAID") {
        playWarningSound();
        showBanner("status-unpaid", "💳 Payment Required", (data.name || "Attendee") + " • " + (data.message || "Unpaid"));
        addHistoryRecord(data.name, data.id || ticketId, "Unpaid", "badge-red", timeStr);

      } else {
        playWarningSound();
        showBanner("status-invalid", "❌ " + (data.status || "Invalid"), data.message || "Unrecognized code");
        addHistoryRecord("Invalid Code", ticketId, "Invalid", "badge-red", timeStr);
      }
    }

    function showBanner(className, title, sub) {
      const banner = document.getElementById("result-banner");
      banner.className = className;
      document.getElementById("banner-title").innerText = title;
      document.getElementById("banner-sub").innerText = sub;
      banner.style.display = "block";

      setTimeout(() => {
        banner.style.display = "none";
      }, 3000);
    }

    // --- Drawer & History Management ---
    function openDrawer() {
      document.getElementById("drawer-backdrop").classList.add("active");
      document.getElementById("drawer").classList.add("active");
    }

    function closeDrawer() {
      document.getElementById("drawer-backdrop").classList.remove("active");
      document.getElementById("drawer").classList.remove("active");
    }

    function addHistoryRecord(name, id, status, badgeClass, time) {
      scanHistory.unshift({ name, id, status, badgeClass, time });
      document.getElementById("recent-count").innerText = scanHistory.length;
      document.getElementById("drawer-count").innerText = scanHistory.length;

      const body = document.getElementById("drawer-body");
      // Remove placeholder
      if (scanHistory.length === 1) body.innerHTML = "";

      const card = document.createElement("div");
      card.className = "history-card";
      card.innerHTML = `
        <div>
          <div class="hc-name">${name}</div>
          <div class="hc-id">${id} • ${time}</div>
        </div>
        <div class="hc-badge ${badgeClass}">${status}</div>
      `;
      body.prepend(card);
    }

    // --- Reset Action ---
    function confirmResetRoster() {
      if (confirm("Reset test attendees back to unchecked-in status in your Google Sheet?")) {
        fetch(API_URL + "?action=reset")
          .then(res => res.json())
          .then(d => {
            alert(d.message || "Reset complete!");
            updateCount(0);
            scanHistory = [];
            document.getElementById("recent-count").innerText = "0";
            document.getElementById("drawer-count").innerText = "0";
            document.getElementById("drawer-body").innerHTML = '<div style="color:#64748b; text-align:center; padding: 40px 10px; font-size:14px;">Roster reset. Ready for new scans.</div>';
            closeDrawer();
          })
          .catch(err => alert("Error resetting: " + err.message));
      }
    }

    // --- Camera Initialization ---
    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = {
        fps: 30,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.777778
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        console.warn("Could not start facingMode: environment, falling back:", err);
        Html5Qrcode.getCameras().then(devs => {
          if (devs && devs.length) {
            let selectedCam = devs[0].id;
            for (let c of devs) {
              if (c.label.toLowerCase().includes("back") || c.label.toLowerCase().includes("rear") || c.label.toLowerCase().includes("environment")) {
                selectedCam = c.id;
                break;
              }
            }
            html5QrCode.start(selectedCam, config, onScanSuccess);
          }
        }).catch(e => alert("Camera permission error: " + e));
      });
    }

    startCamera();
  </script>
</body>
</html>
